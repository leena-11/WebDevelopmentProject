<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS JavaScript Demo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Registration</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main>

        <section>

            <h2>Registration Form</h2>

            <form id="myForm">

                <label>Name</label>
                <input type="text" id="name" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Password</label>
                <input type="password"
                       id="password"
                       required
                       pattern="[A-Z]{2}[a-z]{8}[0-9]{2}[^A-Za-z0-9]{1}"
                       title="2 Capitals, 8 Small letters, 2 Numbers, 1 Symbol">

                <button type="button" onclick="showMessage()">
                    Submit
                </button>

            </form>

            <h3 id="result"></h3>

        </section>

    </main>

    <footer>
        <p>© 2026 Student Registration</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
